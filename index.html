<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>World Explorer: Flood-Proof Architecture</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Open Sans', sans-serif;
      background-color: #0b1d3a;
      color: #333;
    }

    #webgl-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* UI Overlay */
    .header-title {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 10;
      color: #ffffff;
      font-family: 'Fredoka One', cursive;
      font-size: 24px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      pointer-events: none;
    }

    .instruction-banner {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(11, 29, 58, 0.85);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      border: 2px solid #4a90e2;
      pointer-events: none;
      text-align: center;
    }

    /* Modal Card */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 20;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .card-header {
      background: #1a365d;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-family: 'Fredoka One', cursive;
      font-size: 20px;
    }

    .close-btn {
      background: #e53e3e;
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }

    .card-image-container {
      width: 100%;
      height: 240px;
      background-color: #e2e8f0;
      position: relative;
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 20px;
    }

    .card-text {
      font-size: 16px;
      line-height: 1.5;
      color: #2d3748;
    }
  </style>
</head>
<body>

  <div class="header-title">🌍 World Explorer: Flood-Proof Homes</div>
  <div class="instruction-banner">Touch and drag to rotate the globe. Tap a pin to explore!</div>
  
  <div id="webgl-container"></div>

  <!-- Modal Display -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="card-header">
        <div class="card-title" id="modalTitle">Country Title</div>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="card-image-container">
        <img id="modalImage" class="card-image" src="" alt="Location image">
      </div>
      <div class="card-body">
        <div class="flex items-center gap-2 mb-3">
          <span id="modalBadge" class="inline-block px-3 py-1 rounded-full text-xs font-bold border"></span>
        </div>
        <p class="card-text" id="modalDesc">Description goes here...</p>
      </div>
    </div>
  </div>

  <script>
    // Local repository images linked directly via relative paths
    const locations = [
      {
        id: 'cambodia',
        country: 'Cambodia',
        flag: '🇰🇭',
        title: 'Stilt Houses',
        structure: 'FRAME STRUCTURE',
        badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-400',
        pinColor: 0x10b981,
        lat: 12.5657,
        lng: 104.9910,
        description: 'Built high on tall wooden posts so high water flows right underneath without touching the living room!',
        image: 'CAMBODIA.png'
      },
      {
        id: 'netherlands',
        country: 'The Netherlands',
        flag: '🇳🇱',
        title: 'Floating Homes',
        structure: 'SOLID & FRAME STRUCTURE',
        badgeClass: 'bg-blue-100 text-blue-800 border-blue-400',
        pinColor: 0x3b82f6,
        lat: 52.3676,
        lng: 4.9041,
        description: 'Built on hollow concrete bases that act like boats! When flood water rises, the whole house floats up safely.',
        image: 'NETHERLANDS.gif'
      },
      {
        id: 'japan',
        country: 'Japan',
        flag: '🇯🇵',
        title: 'Sealed Barrier Buildings',
        structure: 'SHELL STRUCTURE',
        badgeClass: 'bg-rose-100 text-rose-800 border-rose-400',
        pinColor: 0xf43f5e,
        lat: 35.6762,
        lng: 139.6503,
        description: 'Strong watertight doors and thick walls seal the building like a glass jar to keep heavy flood waters out.',
        image: 'JAPAN.png'
      },
      {
        id: 'india',
        country: 'India',
        flag: '🇮🇳',
        title: 'Bamboo Elevated Domes',
        structure: 'SHELL & FRAME STRUCTURE',
        badgeClass: 'bg-orange-100 text-orange-800 border-orange-400',
        pinColor: 0xf97316,
        lat: 26.2006,
        lng: 92.9376,
        description: 'Curved bamboo shells built high off the ground that let strong flood winds and river currents pass around easily.',
        image: 'INDIA.jpg'
      },
      {
        id: 'usa',
        country: 'USA (Louisiana)',
        flag: '🇺🇸',
        title: 'Bayou Stilt Homes',
        structure: 'FRAME STRUCTURE',
        badgeClass: 'bg-purple-100 text-purple-800 border-purple-400',
        pinColor: 0xa855f7,
        lat: 29.9511,
        lng: -90.0715,
        description: 'Raised high on open wooden frames so ocean storm surges wash safely beneath the house.',
        image: 'USA.jpg'
      },
      {
        id: 'peru',
        country: 'Peru',
        flag: '🇵🇪',
        title: 'Floating Reed Islands',
        structure: 'SOLID STRUCTURE',
        badgeClass: 'bg-amber-100 text-amber-800 border-amber-400',
        pinColor: 0xd97706,
        lat: -15.8402,
        lng: -69.3360,
        description: 'Island homes built on floating mats of thick reeds. The floating village rises and falls with lake levels.',
        image: 'PERU.jpg'
      },
      {
        id: 'uk',
        country: 'United Kingdom',
        flag: '🇬🇧',
        title: 'Property Flood Barriers',
        structure: 'FRAME & SOLID STRUCTURE',
        badgeClass: 'bg-indigo-100 text-indigo-800 border-indigo-400',
        pinColor: 0x6366f1,
        lat: 54.0000,
        lng: -3.2000,
        description: 'Flood walls and gates built around the garden. Strong barriers keep river water away from house doors.',
        image: 'UK.png'
      },
      {
        id: 'cameroon',
        country: 'Cameroon',
        flag: '🇨🇲',
        title: 'Musgum Mud Dome Homes',
        structure: 'SHELL STRUCTURE',
        badgeClass: 'bg-yellow-100 text-yellow-800 border-yellow-400',
        pinColor: 0xeab308,
        lat: 10.6333,
        lng: 15.0833,
        description: 'Tall mud domes with grooved walls so heavy flood rain slides off quickly without soaking into the walls!',
        image: 'CAMEROON.jpg'
      }
    ];

    // Three.js Setup
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 250;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.enableZoom = false;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, 3, 5);
    scene.add(dirLight);

    // Globe Mesh
    const globeRadius = 80;
    const globeGeo = new THREE.SphereGeometry(globeRadius, 64, 64);
    const globeMat = new THREE.MeshPhongMaterial({
      color: 0x1d4ed8,
      emissive: 0x0a192f,
      wireframe: false,
      shininess: 15
    });
    const globe = new THREE.Mesh(globeGeo, globeMat);
    scene.add(globe);

    // Lat/Lng Helper Functions
    function latLngToVector3(lat, lng, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lng + 180) * (Math.PI / 180);
      const x = -(radius * Math.sin(phi) * Math.cos(theta));
      const z = radius * Math.sin(phi) * Math.sin(theta);
      const y = radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }

    // Add Location Pins
    const pinObjects = [];
    locations.forEach(loc => {
      const pinGeo = new THREE.SphereGeometry(2.5, 16, 16);
      const pinMat = new THREE.MeshBasicMaterial({ color: loc.pinColor });
      const pinMesh = new THREE.Mesh(pinGeo, pinMat);

      const pos = latLngToVector3(loc.lat, loc.lng, globeRadius + 1.5);
      pinMesh.position.copy(pos);
      pinMesh.userData = loc;

      globe.add(pinMesh);
      pinObjects.push(pinMesh);
    });

    // Raycasting / Interaction
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onPointerDown(event) {
      const x = (event.clientX || (event.touches && event.touches[0].clientX));
      const y = (event.clientY || (event.touches && event.touches[0].clientY));
      
      if (!x || !y) return;

      mouse.x = (x / window.innerWidth) * 2 - 1;
      mouse.y = -(y / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(pinObjects);

      if (intersects.length > 0) {
        const data = intersects[0].object.userData;
        openModal(data);
      }
    }

    window.addEventListener('click', onPointerDown);

    function openModal(data) {
      document.getElementById('modalTitle').innerText = `${data.flag} ${data.country}: ${data.title}`;
      document.getElementById('modalImage').src = data.image;
      
      const badge = document.getElementById('modalBadge');
      badge.innerText = data.structure;
      badge.className = `inline-block px-3 py-1 rounded-full text-xs font-bold border ${data.badgeClass}`;

      document.getElementById('modalDesc').innerText = data.description;
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      globe.rotation.y += 0.0015;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
