<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Flood-Proof Globe</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Fredoka (Headings) & Nunito (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js & OrbitControls Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            user-select: none;
            overflow: hidden;
            background-color: #030712;
            touch-action: none;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Fredoka', cursive, sans-serif;
        }
        .globe-canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Glassmorphism panel styling */
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        /* Floating label bounce animation */
        @keyframes float-bounce {
            0%, 100% { transform: translate(-50%, -100%) translateY(0); }
            50% { transform: translate(-50%, -100%) translateY(-6px); }
        }
        .globe-pin-label {
            position: absolute;
            z-index: 10;
            pointer-events: auto;
            cursor: pointer;
            animation: float-bounce 2.5s ease-in-out infinite;
            transition: opacity 0.25s ease, transform 0.15s ease;
            will-change: transform, opacity;
        }
        /* Ensure hovered labels pop over neighboring overlapping labels */
        .globe-pin-label:hover {
            z-index: 50 !important;
            transform: translate(-50%, -105%) scale(1.08);
        }
        /* Custom scrollbar for content card */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen w-screen relative select-none">

    <!-- 3D Canvas Viewport -->
    <div id="canvas-container" class="globe-canvas-container"></div>

    <!-- 2D Overlay Container for Floating Pin Labels -->
    <div id="labels-container" class="absolute inset-0 pointer-events-none z-10 overflow-hidden"></div>

    <!-- Header Overlay Banner -->
    <header class="absolute top-2 sm:top-4 left-2 sm:left-4 right-2 sm:right-4 z-20 pointer-events-none flex justify-center">
        <div class="pointer-events-auto bg-slate-900/95 text-white px-4 sm:px-6 py-2.5 sm:py-3.5 rounded-2xl sm:rounded-full shadow-2xl border-2 sm:border-4 border-blue-400/60 backdrop-blur-md flex items-center justify-between gap-3 sm:gap-4 max-w-2xl w-full">
            <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
                <span class="text-3xl sm:text-5xl animate-pulse shrink-0">🌍</span>
                <div class="min-w-0">
                    <h1 class="text-base sm:text-2xl font-black leading-tight tracking-wide text-blue-200 whitespace-nowrap">Flood-Proof Globe</h1>
                    <p class="text-xs sm:text-base text-blue-300 font-extrabold leading-tight">Spin globe • Tap country to explore!</p>
                </div>
            </div>
            <!-- Visited Counter Badge -->
            <div class="bg-blue-900/80 px-3 py-1.5 rounded-full border border-blue-400/50 text-xs sm:text-sm font-black text-amber-300 whitespace-nowrap shrink-0">
                <span id="visited-count">0</span> / <span id="total-count">7</span> Explored
            </div>
        </div>
    </header>

    <!-- ESL Information Modal Card -->
    <div id="info-modal" class="fixed inset-0 z-30 flex items-center justify-center p-4 sm:p-6 bg-slate-950/80 backdrop-blur-md hidden transition-opacity duration-200">
        <div class="glass-card w-full max-w-2xl rounded-3xl p-6 sm:p-8 shadow-2xl relative border-8 border-white flex flex-col max-h-[92vh]">
            
            <!-- Close Button -->
            <button onclick="closeInfoModal()" aria-label="Close information dialog" class="absolute top-4 right-4 w-12 h-12 bg-slate-200 hover:bg-rose-500 hover:text-white text-slate-800 rounded-full font-black flex items-center justify-center text-2xl transition-all shadow-lg z-10 active:scale-95">
                ✕
            </button>

            <!-- Modal Header: Large Flag and Clean Country Name -->
            <div class="flex items-center gap-4 mb-3 pr-10">
                <span id="modal-flag" class="text-5xl sm:text-6xl shrink-0 p-2 bg-slate-100 rounded-2xl shadow-inner border border-slate-200">🇻🇳</span>
                <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2">
                        <span id="modal-country" class="text-lg sm:text-2xl font-black text-blue-600 tracking-wider uppercase block truncate">VIETNAM</span>
                    </div>
                    <h2 id="modal-title" class="text-3xl sm:text-4xl font-black text-slate-900 leading-tight truncate">Stilt Houses</h2>
                </div>
            </div>

            <!-- Structural Type Badge -->
            <div class="mb-4">
                <span id="modal-badge" class="px-5 py-2 text-sm sm:text-base font-black rounded-full bg-emerald-100 text-emerald-800 border-2 border-emerald-400 uppercase tracking-wide inline-block shadow-sm">
                    FRAME STRUCTURE
                </span>
            </div>

            <!-- Large House Image Container -->
            <div class="relative w-full h-64 sm:h-80 rounded-2xl overflow-hidden mb-4 bg-slate-900 border-4 border-slate-200 shadow-xl shrink-0">
                <img id="modal-image" src="" alt="Flood-proof structure" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=800&q=80'">
            </div>

            <!-- ESL Description Box with Simplified Large Text -->
            <div class="bg-blue-50 rounded-2xl p-5 border-2 border-blue-200 shadow-sm overflow-y-auto custom-scroll">
                <p id="modal-description" class="text-slate-900 text-lg sm:text-2xl font-black leading-relaxed">
                    Houses built high off the ground on tall wooden posts. Floodwater flows safely underneath the house!
                </p>
            </div>

        </div>
    </div>

    <script>
        // Content matrix updated with offset properties for densely populated regions like Europe
        const locations = [

            },

            {

                pinColor: 0x14b8a6,
                lat: 29.9511,
                lng: -90.0715,
                offsetX: 0,
                offsetY: 0,
                description: 'Stilt houses built on tall posts near the water. Big ocean waves and floods pass right under the floor!',
                image: 'https://www.greenbuildermedia.com/hs-fs/hubfs/House%20on%20stilts%20adobe%20stock.webp?width=1000&height=667&name=House%20on%20stilts%20adobe%20stock.webp'
            },
            {
                id: 'peru',
                country: 'Peru',
                flag: '🇵🇪',
                title: 'Floating Reed Islands',
                structure: 'SOLID STRUCTURE',
                badgeClass: 'bg-amber-100 text-amber-800 border-amber-400',
                pinColor: 0xd97706,
                lat: -15.8402,
                lng: -69.3360,
                offsetX: 0,
                offsetY: 0,
                description: 'Island homes built on floating mats of thick reeds. The floating village rises and falls with the lake water!',
                image: 'https://www.globeguide.ca/wp-content/uploads/2014/06/Peru-Puno-Lake-Titicaca.jpg'
            },
            {
                id: 'uk',
                country: 'United Kingdom',
                flag: '🇬🇧',
                title: 'Property Flood Barriers',
                structure: 'FRAME & SOLID STRUCTURE',
                badgeClass: 'bg-indigo-100 text-indigo-800 border-indigo-400',
                pinColor: 0x6366f1,
                lat: 54.0000,
                lng: -3.2000,
                offsetX: -45, // Shift label slightly left to separate cleanly from Netherlands
                offsetY: -15,
                description: 'Flood walls and gates built around the garden. Strong barriers keep river water away from the house!',
                image: 'https://www.miltonkeynes.co.uk/jpim-static/image/2024/10/08/8/19/im-worcesters-k-1259722.jpg?trim=0,449,0,278&width=640&quality=65'
            },
            {
                id: 'cameroon',
                country: 'Cameroon',
                flag: '🇨🇲',
                title: 'Mud Dome Homes',
                structure: 'SHELL STRUCTURE',
                badgeClass: 'bg-fuchsia-100 text-fuchsia-800 border-fuchsia-400',
                pinColor: 0xd946ef,
                lat: 10.2897,
                lng: 15.0808,
                offsetX: 0,
                offsetY: 0,
                description: 'Tall mud domes shaped like curved shells. Outer grooves drain heavy rainwater, and top holes provide emergency roof exits during sudden flash floods!',
                image: 'https://apsaidal.com/wp-content/uploads/2023/05/Musgum-Dwellings_Cam0492_Habitation_de_Pouss.jpg'
            }
        ];

        let scene, camera, renderer, globe, clouds, controls;
        let markers3D = [];
        let labelElements = [];
        const EARTH_RADIUS = 70;
        
        // Track visited location indices in student session
        const visitedLocations = new Set();

        // Fallback procedural Earth texture generator
        function generateFallbackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#1e3a8a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#15803d';
            ctx.beginPath();
            ctx.ellipse(250, 200, 120, 90, 0.2, 0, Math.PI * 2);
            ctx.ellipse(320, 380, 80, 110, -0.2, 0, Math.PI * 2);
            ctx.ellipse(550, 180, 100, 70, 0, 0, Math.PI * 2);
            ctx.ellipse(560, 320, 90, 110, 0, 0, Math.PI * 2);
            ctx.ellipse(780, 200, 160, 100, 0, 0, Math.PI * 2);
            ctx.ellipse(820, 380, 70, 60, 0, 0, Math.PI * 2);
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            document.getElementById('total-count').textContent = locations.length;
            
            // Scene
            scene = new THREE.Scene();

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 25, 230);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            // Orbit Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.8;
            controls.enableZoom = true;
            controls.minDistance = 95;
            controls.maxDistance = 290;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
            sunLight.position.set(500, 200, 300);
            scene.add(sunLight);

            // Starfield
            createStarfield();

            // Earth Sphere
            const globeGeometry = new THREE.SphereGeometry(EARTH_RADIUS, 64, 64);
            const textureLoader = new THREE.TextureLoader();

            const earthMapUrl = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/planets/earth_atmos_2048.jpg';
            const earthSpecUrl = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/planets/earth_specular_2048.jpg';
            const cloudsMapUrl = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/planets/earth_clouds_1024.png';

            let globeMaterial;
            try {
                const earthTexture = textureLoader.load(earthMapUrl);
                const specularTexture = textureLoader.load(earthSpecUrl);

                globeMaterial = new THREE.MeshPhongMaterial({
                    map: earthTexture,
                    specularMap: specularTexture,
                    specular: new THREE.Color(0x333333),
                    shininess: 25
                });
            } catch (err) {
                globeMaterial = new THREE.MeshPhongMaterial({
                    map: generateFallbackTexture(),
                    shininess: 15
                });
            }

            globe = new THREE.Mesh(globeGeometry, globeMaterial);
            scene.add(globe);

            // Clouds Mesh Layer
            try {
                const cloudGeometry = new THREE.SphereGeometry(EARTH_RADIUS + 1.2, 64, 64);
                const cloudTexture = textureLoader.load(cloudsMapUrl);
                const cloudMaterial = new THREE.MeshPhongMaterial({
                    map: cloudTexture,
                    transparent: true,
                    opacity: 0.38,
                    blending: THREE.AdditiveBlending
                });
                clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
                scene.add(clouds);
            } catch (e) {
                console.log('Clouds layer skipped');
            }

            // Outer Atmosphere Glow
            const atmosGeometry = new THREE.SphereGeometry(EARTH_RADIUS + 3.2, 64, 64);
            const atmosMaterial = new THREE.MeshBasicMaterial({
                color: 0x3b82f6,
                transparent: true,
                opacity: 0.16,
                side: THREE.BackSide
            });
            scene.add(new THREE.Mesh(atmosGeometry, atmosMaterial));

            // Create 3D markers and 2D labels for all locations
            locations.forEach((loc, index) => {
                const marker = createMarkerMesh(loc, EARTH_RADIUS, index);
                globe.add(marker);
                markers3D.push(marker);

                create2DLabel(loc, index);
            });

            // Initial view angle over Asia / Europe
            globe.rotation.y = -2.1;

            window.addEventListener('resize', onWindowResize);

            // Raycaster for clicking 3D pin objects directly
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            renderer.domElement.addEventListener('pointerdown', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(markers3D, true);

                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj.parent && obj.userData.locationIndex === undefined) {
                        obj = obj.parent;
                    }
                    if (obj.userData.locationIndex !== undefined) {
                        openLocationModal(obj.userData.locationIndex);
                    }
                }
            });

            animate();
        }

        function createStarfield() {
            const starGeo = new THREE.BufferGeometry();
            const count = 900;
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 1300;
                positions[i + 1] = (Math.random() - 0.5) * 1300;
                positions[i + 2] = (Math.random() - 0.5) * 1300;
            }

            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.3,
                transparent: true,
                opacity: 0.75
            });
            scene.add(new THREE.Points(starGeo, starMat));
        }

        // GPS Lat/Lng to Vector3 transformation
        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));

            return new THREE.Vector3(x, y, z);
        }

        function createMarkerMesh(loc, radius, index) {
            const markerGroup = new THREE.Group();
            const pos = latLngToVector3(loc.lat, loc.lng, radius);
            markerGroup.position.copy(pos);

            markerGroup.lookAt(new THREE.Vector3(0,0,0));
            markerGroup.rotateY(Math.PI);

            // Needle shaft
            const pinGeo = new THREE.CylinderGeometry(0.5, 0.1, 7, 12);
            pinGeo.rotateX(Math.PI / 2);
            const pinMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const pinMesh = new THREE.Mesh(pinGeo, pinMat);
            pinMesh.position.z = 3.5;
            markerGroup.add(pinMesh);

            // Pin Head Sphere
            const headGeo = new THREE.SphereGeometry(2.6, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({
                color: loc.pinColor,
                roughness: 0.2,
                emissive: loc.pinColor,
                emissiveIntensity: 0.35
            });
            const headMesh = new THREE.Mesh(headGeo, headMat);
            headMesh.position.z = 7;
            headMesh.name = "headMesh";
            markerGroup.add(headMesh);

            markerGroup.userData = { locationIndex: index };
            return markerGroup;
        }

        function create2DLabel(loc, index) {
            const container = document.getElementById('labels-container');
            const label = document.createElement('div');
            label.className = 'globe-pin-label';
            label.id = `label-${index}`;
            
            // Build large easy-to-read tag with Country Flag + Title
            label.innerHTML = `
                <div id="label-card-${index}" onclick="openLocationModal(${index})" class="bg-white px-4 py-2 rounded-full shadow-2xl border-4 border-slate-900 flex items-center gap-2.5 cursor-pointer font-black text-slate-900 text-sm sm:text-lg hover:bg-yellow-100 transition-all">
                    <span class="text-2xl sm:text-3xl">${loc.flag}</span>
                    <div class="flex flex-col">
                        <span class="leading-none text-slate-900">${loc.country}</span>
                        <span class="text-xs sm:text-sm font-extrabold text-blue-700">${loc.title}</span>
                    </div>
                    <span id="visited-tag-${index}" class="hidden ml-1 px-2 py-0.5 bg-emerald-500 text-white text-xs font-black rounded-full">✓ Explored</span>
                </div>
            `;
            container.appendChild(label);
            labelElements.push({ 
                element: label, 
                lat: loc.lat, 
                lng: loc.lng,
                offsetX: loc.offsetX || 0,
                offsetY: loc.offsetY || 0
            });
        }

        function updateLabels() {
            if (!globe) return;

            const tempV = new THREE.Vector3();
            labelElements.forEach((item) => {
                const pos = latLngToVector3(item.lat, item.lng, EARTH_RADIUS + 7.5);
                pos.applyMatrix4(globe.matrixWorld);

                tempV.copy(pos).sub(camera.position).normalize();
                const normal = pos.clone().normalize();
                const isBehind = normal.dot(tempV) > 0.15;

                if (isBehind) {
                    item.element.style.opacity = '0';
                    item.element.style.pointerEvents = 'none';
                } else {
                    pos.project(camera);
                    let x = (pos.x * 0.5 + 0.5) * window.innerWidth + item.offsetX;
                    let y = (-(pos.y * 0.5) + 0.5) * window.innerHeight + item.offsetY;

                    item.element.style.left = `${x}px`;
                    item.element.style.top = `${y}px`;
                    item.element.style.opacity = '1';
                    item.element.style.pointerEvents = 'auto';
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (clouds) clouds.rotation.y += 0.00025;
            if (globe) globe.rotation.y += 0.0004;

            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function openLocationModal(index) {
            const loc = locations[index];

            // Mark location as visited
            visitedLocations.add(index);
            document.getElementById('visited-count').textContent = visitedLocations.size;

            // Apply visual color changes to visited 2D label
            const labelCard = document.getElementById(`label-card-${index}`);
            if (labelCard) {
                labelCard.classList.remove('bg-white', 'border-slate-900');
                labelCard.classList.add('bg-emerald-50', 'border-emerald-500');
            }
            const visitedTag = document.getElementById(`visited-tag-${index}`);
            if (visitedTag) {
                visitedTag.classList.remove('hidden');
            }

            // Apply visual color change to 3D Pin Head (Gold/Amber highlight)
            const marker = markers3D[index];
            if (marker) {
                marker.traverse((child) => {
                    if (child.name === "headMesh") {
                        child.material.color.setHex(0xf59e0b); // Golden amber
                        child.material.emissive.setHex(0xd97706);
                    }
                });
            }

            // Populate Modal Content
            document.getElementById('modal-flag').textContent = loc.flag;
            document.getElementById('modal-country').textContent = loc.country;
            document.getElementById('modal-title').textContent = loc.title;
            
            const badge = document.getElementById('modal-badge');
            badge.textContent = loc.structure;
            badge.className = `px-5 py-2 text-sm sm:text-base font-black rounded-full border-2 ${loc.badgeClass} uppercase tracking-wide inline-block shadow-sm`;

            const imgEl = document.getElementById('modal-image');
            imgEl.src = loc.image;
            imgEl.alt = `${loc.country} ${loc.title}`;

            document.getElementById('modal-description').textContent = loc.description;

            const modal = document.getElementById('info-modal');
            modal.classList.remove('hidden');
        }

        function closeInfoModal() {
            document.getElementById('info-modal').classList.add('hidden');
        }

        // Close modal on Escape key press
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeInfoModal();
        });

        // Initialize on window load
        window.onload = function() {
            init3D();
        };
    </script>
</body>
</html>
